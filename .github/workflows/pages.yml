# Build, gate, and publish the page.
#
# Four gates, and all four run here.
#
# `npm run build` runs three of them before vite writes anything: every number
# in the README is rebuilt from the measurement, the segmentation is round
# tripped over polytonic Greek, Coptic, Linear B, Korean and emoji with its
# fracture counts asserted, and every font's licence is checked against its own
# embedded records.
#
# The fourth needs a served page and a real browser, so it runs against the
# built output in its own job. It exists because of a specific regression: an
# author `display: flex` defeated a `hidden` attribute and put an empty red
# error bar in the middle of the page on every healthy load. That shipped with a
# green build, because at the time the only gate that would have caught it was
# one nothing ran.
#
# Nothing deploys unless all of them pass, and that promise is enforced twice:
# by the `needs:` on the deploy job, and by the fact that the two jobs running
# other people's code cannot deploy even if they wanted to. See the permissions
# note below.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default. `pages: write` and `id-token: write` are the pair that
# creates a Pages deployment, and they are granted on the deploy job alone.
#
# They used to live here, at workflow level, which handed them to `build` and
# `loading`. Those two jobs run `npm ci`, which executes dependency postinstall
# hooks, and `npx playwright install --with-deps`, which installs system
# packages as root. Granting deployment credentials to the jobs that run other
# people's code, and then promising in the header that nothing deploys unless
# the gates pass, is a guarantee contradicted by the lines above it.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # persist-credentials: false, so the job's token is not left in
      # .git/config where an install hook could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check:licences reads the name table out of each font binary, because
      # the binary is the authority on its own copyright and not the prose
      # beside it. That needs fontTools, which is not on a clean runner, and
      # the first push to this repository failed here rather than anywhere
      # interesting.
      #
      # The [woff] extra is not optional: woff2 is brotli compressed, so
      # fontTools without it opens the file and then cannot decompress the
      # table it was asked for. That was the second failed push.
      #
      # Pinned to the version this was verified against locally, so the thing
      # that reads the licence records is the same thing in both places.
      - run: python -m pip install --disable-pip-version-check "fonttools[woff]==4.63.0"
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  loading:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # The gate drives the page the visitor gets, not the dev server.
      - name: serve the built page and gate it
        run: |
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173/ --timeout 60000
          TOKENLAB_URL=http://localhost:4173/ npm run check:loading

  deploy:
    # Only after both gates, and the only job holding the permissions that can
    # publish anything. A page that looks broken on a healthy load must not
    # reach anyone just because the numbers happened to be right.
    needs: [build, loading]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
